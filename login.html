
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Events | Login</title>

<style>
:root {
  --navy:#070d24;
  --panel:#111a35;
  --mint:#78ead2;
  --purple:#7169d5;
  --blue:#4b8df5;
  --white:#f5f7ff;
  --muted:#aab5d2;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  color:var(--white);
  background:radial-gradient(circle at top left,#18264c,transparent 40%),var(--navy);
}

.container {
  width:100%;
  max-width:950px;
  min-height:570px;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:var(--panel);
  border:1px solid #26345b;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 20px 60px #0008;
}

.left {
  padding:50px 40px;
  background:linear-gradient(145deg,#101b40,#080e25);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.logo {
  font-size:30px;
  font-weight:bold;
  letter-spacing:2px;
}

.logo span { color:var(--mint); }

.left h1 {
  font-size:42px;
  line-height:1.15;
  margin-top:65px;
}

.left p {
  color:var(--muted);
  line-height:1.8;
}

.right {
  padding:45px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.form {
  width:100%;
  max-width:370px;
}

h2 { font-size:30px; }

.subtitle {
  color:var(--muted);
  font-size:14px;
  margin-bottom:25px;
}

.tabs {
  display:flex;
  background:#080f27;
  padding:5px;
  border-radius:10px;
  margin-bottom:25px;
}

.tabs button {
  flex:1;
  padding:12px;
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-weight:bold;
  border-radius:8px;
}

.tabs button.active {
  background:var(--mint);
  color:#071326;
}

.field { margin-bottom:17px; }

label {
  display:block;
  margin-bottom:8px;
  font-size:13px;
}

input {
  width:100%;
  padding:14px;
  background:#080f27;
  border:1px solid #2b385d;
  border-radius:9px;
  color:white;
  outline:none;
}

input:focus { border-color:var(--mint); }

.password {
  position:relative;
}

.password input { padding-right:65px; }

.show {
  position:absolute;
  right:12px;
  top:13px;
  color:var(--mint);
  background:none;
  border:none;
  cursor:pointer;
}

.options {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:15px 0 22px;
  font-size:12px;
}

.options a {
  color:var(--mint);
  text-decoration:none;
}

.primary {
  width:100%;
  padding:15px;
  border:none;
  border-radius:9px;
  background:var(--mint);
  color:#071326;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.primary:hover { background:#9af5e2; }

.message {
  font-size:13px;
  margin-top:15px;
  color:#ff8c96;
  line-height:1.5;
}

.message.success { color:var(--mint); }

.hidden { display:none !important; }

.dashboard { text-align:center; }

.avatar {
  width:75px;
  height:75px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#d9e9ed;
  border:5px solid var(--purple);
  color:#17334b;
  font-size:28px;
  font-weight:bold;
}

.logout {
  margin-top:20px;
  padding:12px 25px;
  border:1px solid var(--mint);
  border-radius:9px;
  color:var(--mint);
  background:transparent;
  cursor:pointer;
}

@media(max-width:700px) {
  .container {
    grid-template-columns:1fr;
    max-width:440px;
  }

  .left {
    padding:25px;
  }

  .left h1 {
    font-size:29px;
    margin-top:25px;
  }

  .right { padding:30px 24px; }
}
</style>
</head>

<body>

<div class="container">

<section class="left">
  <div class="logo"><span>▶</span> FORGE</div>

  <h1>Your events.<br>One simple place.</h1>

  <p>
    Register, discover events, manage your tickets
    and enjoy a seamless event experience with Forge.
  </p>
</section>

<section class="right">

<div class="form" id="authPanel">

  <h2 id="heading">Welcome back</h2>

  <p class="subtitle" id="subtitle">
    Enter your details to access your account.
  </p>

  <div class="tabs">
    <button class="active" id="loginTab" type="button">Login</button>
    <button id="signupTab" type="button">Sign Up</button>
  </div>

  <form id="authForm">

    <div class="field hidden" id="nameField">
      <label>Full Name</label>
      <input id="name" type="text" placeholder="Your full name">
    </div>

    <div class="field">
      <label>Email Address</label>
      <input id="email" type="email"
      placeholder="Enter your email" required>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="password">
        <input id="password" type="password"
        placeholder="Enter password" required>
        <button class="show" type="button"
        data-target="password">Show</button>
      </div>
    </div>

    <div class="field hidden" id="confirmField">
      <label>Confirm Password</label>
      <div class="password">
        <input id="confirm" type="password"
        placeholder="Confirm password">
        <button class="show" type="button"
        data-target="confirm">Show</button>
      </div>
    </div>

    <div class="options" id="loginOptions">
      <span>
        <input type="checkbox" id="remember"
        style="width:auto"> Remember me
      </span>

      <a href="#" id="forgot">Forgot password?</a>
    </div>

    <button class="primary" id="submitButton">
      Login to Forge
    </button>

    <div class="message" id="message"></div>

  </form>

</div>

<div class="form dashboard hidden" id="dashboard">

  <div class="avatar" id="avatar">F</div>

  <h2 id="welcome">Welcome!</h2>

  <p>You have successfully logged into Forge Events.</p>

  <button class="logout" id="logout">Logout</button>

</div>

</section>
</div>

<!-- FIREBASE AUTHENTICATION -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 sendPasswordResetEmail,
 updateProfile,
 signOut,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* REPLACE WITH YOUR FIREBASE CONFIGURATION */

const firebaseConfig = {
 apiKey: "YOUR_API_KEY",
 authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
 projectId: "YOUR_PROJECT_ID",
 storageBucket: "YOUR_PROJECT_ID.appspot.com",
 messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
 appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

let mode = "login";

function message(text, success=false) {
 $("message").textContent = text;
 $("message").className =
 success ? "message success" : "message";
}

function setMode(newMode) {
 mode = newMode;
 const signup = mode === "signup";

 $("heading").textContent =
 signup ? "Create Account" : "Welcome back";

 $("subtitle").textContent =
 signup ? "Join Forge Events today." :
 "Enter your details to access your account.";

 $("nameField").classList.toggle("hidden",!signup);
 $("confirmField").classList.toggle("hidden",!signup);
 $("loginOptions").classList.toggle("hidden",signup);

 $("loginTab").classList.toggle("active",!signup);
 $("signupTab").classList.toggle("active",signup);

 $("submitButton").textContent =
 signup ? "Create Account" : "Login to Forge";

 message("");
}

$("loginTab").onclick = () => setMode("login");
$("signupTab").onclick = () => setMode("signup");

document.querySelectorAll(".show").forEach(button => {
 button.onclick = () => {
   const field = $(button.dataset.target);
   field.type = field.type === "password" ?
   "text" : "password";
   button.textContent =
   field.type === "password" ? "Show" : "Hide";
 };
});

function showDashboard(user) {
 const name = user.displayName ||
 user.email.split("@")[0];

 $("authPanel").classList.add("hidden");
 $("dashboard").classList.remove("hidden");

 $("welcome").textContent = "Welcome, " + name + "!";
 $("avatar").textContent = name[0].toUpperCase();
}

function friendlyError(error) {
 const errors = {
  "auth/email-already-in-use":
  "This email is already registered.",
  "auth/invalid-email":
  "Please enter a valid email.",
  "auth/weak-password":
  "Password must have at least 6 characters.",
  "auth/invalid-credential":
  "Incorrect email or password.",
  "auth/too-many-requests":
  "Too many attempts. Try again later.",
  "auth/unauthorized-domain":
  "Please authorise this website domain in Firebase."
 };

 return errors[error.code] ||
 "Something went wrong: " + error.message;
}

$("authForm").addEventListener("submit",async e => {
 e.preventDefault();

 const email = $("email").value.trim();
 const password = $("password").value;
 const button = $("submitButton");

 button.disabled = true;

 try {

  if(mode === "signup") {

   const name = $("name").value.trim();
   const confirm = $("confirm").value;

   if(!name) throw new Error("Enter your full name.");
   if(password.length < 6)
    throw new Error("Password must have at least 6 characters.");
   if(password !== confirm)
    throw new Error("Passwords do not match.");

   const result =
   await createUserWithEmailAndPassword(
    auth,email,password
   );

   await updateProfile(result.user,{
    displayName:name
   });

   showDashboard(result.user);

  } else {

   const result =
   await signInWithEmailAndPassword(
    auth,email,password
   );

   showDashboard(result.user);
  }

 } catch(error) {

  message(error.code ? friendlyError(error) : error.message);

 } finally {

  button.disabled = false;
  button.textContent =
   mode === "signup" ? "Create Account" : "Login to Forge";
 }
});

/* FORGOT PASSWORD */

$("forgot").addEventListener("click",async e => {
 e.preventDefault();

 const email = $("email").value.trim();

 if(!email) {
  message("Enter your registered email address first.");
  $("email").focus();
  return;
 }

 try {

  await sendPasswordResetEmail(auth,email);

  message(
   "Password reset email sent! Check your inbox and spam folder.",
   true
  );

 } catch(error) {

  message(friendlyError(error));
 }
});

/* LOGOUT */

$("logout").onclick = async () => {
 try {
  await signOut(auth);
  $("authForm").reset();
  $("dashboard").classList.add("hidden");
  $("authPanel").classList.remove("hidden");
  setMode("login");
 } catch(error) {
  message(friendlyError(error));
 }
};

/* RESTORE SIGNED-IN SESSION */

onAuthStateChanged(auth,user => {
 if(user) showDashboard(user);
});

</script>

</body>
</html>
